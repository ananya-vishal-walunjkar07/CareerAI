<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerAI - Sign Up</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
<div class="auth-box">
<a href="index.html" class="logo">Career<span>AI</span></a>
<h1>Create your account</h1>
<p class="form-subtitle">Get started with CareerAI.</p>
<form id="signupForm">
<label for="signupName">Full Name</label>
<input type="text" id="signupName" placeholder="Enter your name">
<label for="signupEmail">Email</label>
<input type="email" id="signupEmail" placeholder="Enter your email">
<p class="demo-hint">Example: ananya@gmail.com</p>
<label for="signupUsername">Username</label>
<input type="text" id="signupUsername" placeholder="Choose a username">
<p class="demo-hint">Example: ananya_123</p>
<label for="signupPassword">Password</label>
<input type="password" id="signupPassword" placeholder="Create a password">
<p class="demo-hint">Example: Career@123</p>
<button type="submit" class="form-button">Create Account</button>
<p class="form-message" id="signupMessage"></p>
</form>
<p class="switch-form">Already have an account? <a href="login.html">Login</a></p>
</div>
<script src="script.js"></script>
</body>
</html>
