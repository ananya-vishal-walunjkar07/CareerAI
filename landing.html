<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerAI</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="navbar">
        <div class="logo">CareerAI</div>

        <nav>
            <a href="#about">About</a>
            <a href="#login">Login</a>
        </nav>
    </header>


    <!-- LANDING PAGE -->
    <main class="hero">

        <!-- TEXT ABOVE VIDEO -->
        <h1 class="hero-text top-text">
            From where you are,
        </h1>


        <!-- VIDEO -->
        <div class="video-card">

            <video
                class="hero-video"
                autoplay
                muted
                loop
                playsinline
                controls
            >
                <source src="selection.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

        </div>


        <!-- TEXT BELOW VIDEO -->
        <h1 class="hero-text bottom-text">
            to where you want to be.
        </h1>

    </main>

</body>
</html>
